name: Deploy

on:
  push:
    branches:
      - main
  # A manual run for proving the rollback live (docs/progressive-release.md). The only input is
  # off by default; a push to main never sets it, so normal deploys are unchanged.
  workflow_dispatch:
    inputs:
      force_guardrail_failure:
        description: "Force the guardrail to fail so the Rollback step runs and Promote is skipped"
        type: boolean
        default: false

permissions:
  contents: read

# The worker is built once, in a job with no secrets and no environment. The production
# job downloads that exact bundle, re-checks its sha256 and publishes it unchanged, so the
# code that reaches production is the code the tests ran against. Bindings, KV, cron
# triggers and vars still come from wrangler.toml. The pinned wrangler is the only
# thing installed in the deploy job.
#
# The deploy is gradual: the new version is uploaded with no traffic, CANARY_PERCENT of
# traffic is shifted to it, a guardrail probes it, and only then is it promoted to 100%.
# If the guardrail fails, the Rollback step puts the stable version back and fails the run.
# The mechanics live in scripts/gradual-deploy.sh; docs/progressive-release.md explains them.
env:
  WRANGLER_VERSION: "4.154.0"
  WORKER_NAME: activity-feed
  WORKER_URL: https://activities.sradams.co.uk/feed.json
  CANARY_PERCENT: "10"
  GUARDRAIL_REQUESTS: "20"
  GUARDRAIL_INTERVAL_SECONDS: "3"
  GUARDRAIL_MAX_ERROR_PERCENT: "10"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: node --experimental-strip-types --test src/*.test.ts
      - name: Bundle the worker
        # A dry run bundles src/index.ts to dist/index.js without contacting Cloudflare.
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir dist
      - name: Compute the bundle digest
        id: digest
        # Only index.js is published: wrangler's dist/README.md carries a timestamp.
        run: |
          mkdir bundle
          cp dist/index.js bundle/index.js
          echo "sha256=$(sha256sum bundle/index.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-bundle-${{ github.sha }}
          path: bundle/index.js
          if-no-files-found: error
          # A re-run on the same commit replaces the artifact; the new build job output digest
          # is what the deploy job verifies, so the check is not weakened.
          overwrite: true
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: build
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # The allowlist is the recommended policy of this job in run 43177918906
      # (https://app.stepsecurity.io/github/adamsuk/activity-feed/actions/runs/43177918906).
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            activities.sradams.co.uk:443
            api.cloudflare.com:443
            github.com:443
            registry.npmjs.org:443
            sparrow.cloudflare.com:443
      # Checked out for wrangler.toml (bindings, KV, cron triggers, vars) and scripts/gradual-deploy.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-bundle-${{ github.sha }}
          path: bundle
      - name: Verify the bundle digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.digest }}
        run: |
          test -n "$EXPECTED_SHA256"
          echo "${EXPECTED_SHA256}  bundle/index.js" | sha256sum --check --strict
      # The credential is written once and reused by alias on the steps that call Cloudflare.
      # The guardrail probes the public URL and never sees it.
      - name: Record the stable version and upload the new one
        id: begin
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bash scripts/gradual-deploy.sh begin
      - name: Canary, shift CANARY_PERCENT of traffic to the new version
        id: canary
        if: steps.begin.outputs.stable_version != ''
        env: *cloudflare
        run: bash scripts/gradual-deploy.sh canary
      - name: "Guardrail: canary health"
        id: guardrail
        if: steps.canary.outcome == 'success'
        env:
          GUARDRAIL_FORCE_FAIL: ${{ inputs.force_guardrail_failure && 'true' || 'false' }}
        run: bash scripts/gradual-deploy.sh guardrail
      - name: Rollback to the stable version
        # Runs when the canary step ran (even if it failed or timed out after traffic was split)
        # and the guardrail did not pass: failed, cancelled or never ran. Skipped when no canary
        # was started, so there is nothing to undo. Restoring the stable version is idempotent.
        if: ${{ always() && steps.canary.outcome != 'skipped' && steps.guardrail.outcome != 'success' }}
        env: *cloudflare
        run: bash scripts/gradual-deploy.sh rollback
      - name: Promote the prebuilt bundle to 100 percent
        # Same verified bundle; a full deploy also applies the cron trigger and vars.
        env: *cloudflare
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --no-bundle bundle/index.js
