name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# The worker is built once, in a job with no secrets and no environment. The production
# job downloads that exact bundle, re-checks its sha256 and publishes it unchanged, so the
# code that reaches production is the code the tests ran against. Bindings, KV, cron
# triggers and vars still come from wrangler.toml. The pinned wrangler is the only
# thing installed in the deploy job.
env:
  WRANGLER_VERSION: "4.160.1"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: node --experimental-strip-types --test src/*.test.ts
      - name: Bundle the worker
        # A dry run bundles src/index.ts to dist/index.js without contacting Cloudflare.
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir dist
      - name: Compute the bundle digest
        id: digest
        # Only index.js is published: wrangler's dist/README.md carries a timestamp.
        run: |
          mkdir bundle
          cp dist/index.js bundle/index.js
          echo "sha256=$(sha256sum bundle/index.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-bundle-${{ github.sha }}
          path: bundle/index.js
          if-no-files-found: error
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: build
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # Checked out for wrangler.toml only (bindings, KV, cron triggers, vars).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-bundle-${{ github.sha }}
          path: bundle
      - name: Verify the bundle digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.digest }}
        run: |
          test -n "$EXPECTED_SHA256"
          echo "${EXPECTED_SHA256}  bundle/index.js" | sha256sum --check --strict
      - name: Publish the prebuilt bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --no-bundle bundle/index.js
