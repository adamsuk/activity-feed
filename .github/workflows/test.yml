name: Test

# Runs the worker tests on every pull request and on every push to main, in a job that
# cannot deploy: it has a read-only token and uses no secret. The deploy lives in
# deploy.yml, runs on push to main only, and is the only place the Cloudflare credential
# is used. src/workflows.test.ts fails if either of those stops being true.
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # The allowlist is the recommended policy of this job in run 43243398124
          # (https://app.stepsecurity.io/github/adamsuk/activity-feed/actions/runs/43243398124),
          # plus registry.npmjs.org:443 so a cold npm cache does not fail the job (maintainer decision).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: node --experimental-strip-types --test src/*.test.ts
