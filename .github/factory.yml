# activity-feed's factory enrolment (see adamsuk/gh-factory README, "Per-repo overrides").
#
# Added by adamsuk/software-factory#151. Without this file station 04 cannot run
# here at all: scripts/gate-issue.sh reads it from a pull request's *base* ref,
# so it has to be on main before any pull request here can be gated.

# Factory agents (see the gh-factory README, "Agents").
agents:
  roles: [intake, builder, reviewer]
  # The documented default. This file grants no new permission: merging here
  # stays a person's decision until Scott says otherwise.
  merge: false
  # .coderabbit.yaml is present and the CodeRabbit check runs on pull requests.
  review_bot: coderabbit
  # The repo's own script: node --experimental-strip-types --test src/*.test.ts
  #
  # These tests DO run in CI, but only on the way out: deploy.yml runs the same
  # command as a "Test" step before the deploy step, on push to main, so a
  # failing test blocks the deploy. What is missing is a *pull request* test
  # gate -- no workflow runs them on pull_request, so a red test is invisible
  # until after merge. Narrower than software-factory#135, and still worth its
  # own ticket. (An earlier version of this comment said no workflow ran them
  # at all; CodeRabbit corrected that on activity-feed#20.)
  test_command: npm test

# Read off a real pull request rather than inferred from the workflow files.
#
# CodeRabbit argued on activity-feed#20 that "CodeQL" is only a workflow name
# and that the matrix legs must be required instead. The check-runs API says
# otherwise: for the head of #20 it returns CodeQL [success] alongside
# Analyze (actions) [success] and Analyze (javascript-typescript) [success], so
# CodeQL is a real check run that gate-issue.sh can match. Requiring the
# aggregate also survives a change to the language matrix, which naming the legs
# would not.
#
# Deploy runs on push to main, not on pull requests, so it is not a pull
# request check and is not required here.
required_checks:
  - changelog / changelog
  - CodeQL
