# activity-feed's factory enrolment (see adamsuk/gh-factory README, "Per-repo overrides").
#
# Added by adamsuk/software-factory#151. Without this file station 04 cannot run
# here at all: scripts/gate-issue.sh reads it from a pull request's *base* ref,
# so it has to be on main before any pull request here can be gated.

# Factory agents (see the gh-factory README, "Agents").
agents:
  roles: [intake, builder, reviewer]
  # The documented default. This file grants no new permission: merging here
  # stays a person's decision until Scott says otherwise.
  merge: false
  # .coderabbit.yaml is present and the CodeRabbit check runs on pull requests.
  review_bot: coderabbit
  # The repo's own script: node --experimental-strip-types --test src/*.test.ts
  #
  # test.yml runs the same command on every pull request and on every push to
  # main, in a job with a read-only token and no secret (software-factory#117).
  # deploy.yml still runs it as a "Test" step before the deploy step.
  test_command: npm test

# Read off a real pull request rather than inferred from the workflow files.
#
# The CodeQL matrix legs, not the "CodeQL" aggregate.
#
# CodeRabbit asked for exactly this on activity-feed#20 and the rebuttal written
# here was wrong. It cited one check-runs reading, for the head of #20, where
# the aggregate happened to be success. One sample of a varying value is not
# evidence. Across two pull requests in this repo:
#
#   #20 (6c773b5)  CodeQL: success   Analyze (actions): success   Analyze (javascript-typescript): success
#   #21 (43b5e7a)  CodeQL: neutral   Analyze (actions): success   Analyze (javascript-typescript): success
#
# The aggregate is neutral when the analysis has nothing to do for the changed
# paths. scripts/gate-issue.sh counts every bucket but pass as red, and neutral
# surfaces as skipping, so requiring it returned "retry" on #21 with all three
# CodeQL checks fine. Do not put the aggregate back.
#
# The old objection stands but is the lesser problem: naming the legs breaks if
# someone changes the language matrix. That fails loudly and once; the aggregate
# failed silently and constantly.
#
# Deploy runs on push to main, not on pull requests, so it is not a pull
# request check and is not required here.
required_checks:
  - changelog / changelog
  - Analyze (actions)
  - Analyze (javascript-typescript)
  # The worker tests, from test.yml (software-factory#117, #115).
  - test
