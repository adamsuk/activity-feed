name = "activity-feed"
account_id = "fcaa04edb848e219bd85f8bfedb0c5b9"
main = "src/index.ts"
compatibility_date = "2026-10-02"
keep_vars = true

# Create the namespace, then paste its id here:
#   npx wrangler kv namespace create FEED
[[kv_namespaces]]
binding = "FEED"
id = "f0a57d469c054cfcaeb542423ca0ef68"

[triggers]
crons = ["*/30 * * * *"]

# GITHUB_ACCOUNTS is a JSON array of {id, label, login}.
# The secret for each id is GITHUB_TOKEN_<ID>, for example GITHUB_TOKEN_PERSONAL.
# INTERVALS_API_KEY is the first Intervals account.
# INTERVALS_ACCOUNTS is an optional JSON array. Extra keys are INTERVALS_API_KEY_<ID>.
# Set secrets with: npx wrangler secret put <NAME>
[vars]
ALLOWED_ORIGINS = "https://sradams.co.uk,https://www.sradams.co.uk,https://sradams-co-uk-content.pages.dev,https://feat-last-seven-days.sradams-co-uk-content.pages.dev,https://feat-github-week.sradams-co-uk-content.pages.dev,https://a02db8d9.sradams-co-uk-content.pages.dev,https://a88ddf1a.sradams-co-uk-content.pages.dev"
GITHUB_ACCOUNTS = "[   {\"id\":\"personal\",\"label\":\"Personal\",\"login\":\"adamsuk\"},   {\"id\":\"work\",\"label\":\"Work\",\"login\":\"sra405\"} ]"
