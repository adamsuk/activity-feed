name = "strava-feed"
main = "src/index.ts"
compatibility_date = "2026-10-02"

# Create the namespace, then paste its id here:
#   npx wrangler kv namespace create FEED
[[kv_namespaces]]
binding = "FEED"
id = "f0a57d469c054cfcaeb542423ca0ef68"

[triggers]
crons = ["*/30 * * * *"]

# INTERVALS_API_KEY reads Intervals.icu.
# GITHUB_TOKEN_PERSONAL and GITHUB_TOKEN_WORK read each GitHub account.
# Set them with: npx wrangler secret put <NAME>
# Do not commit them.
[vars]
ALLOWED_ORIGINS = "https://sradams.co.uk,https://www.sradams.co.uk"
