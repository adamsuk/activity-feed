name = "strava-feed"
main = "src/index.ts"
compatibility_date = "2026-10-02"

# Create the namespace, then paste its id here:
#   npx wrangler kv namespace create FEED
[[kv_namespaces]]
binding = "FEED"
id = "f0a57d469c054cfcaeb542423ca0ef68"

[triggers]
crons = ["*/30 * * * *"]

# The Intervals.icu API key is saved from the Access-protected page.
# Do not commit it.
[vars]
ALLOWED_ORIGINS = "https://sradams.co.uk,https://www.sradams.co.uk"
